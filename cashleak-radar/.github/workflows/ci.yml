name: CI

on:
  push:
    paths:
      - 'cashleak-radar/**'
  pull_request:
    paths:
      - 'cashleak-radar/**'

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cashleak-radar/apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
